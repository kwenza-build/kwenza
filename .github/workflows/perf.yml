name: Performance

# Builds kwenza from the PR's base and from the PR, then times both against the same real project
# (commons-lang3) on this one runner, interleaved. Two jars measured side by side see the same
# noise, which a number stored from an earlier run on another machine would not. See
# benchmarks/README.adoc.

on:
  pull_request:
    # Only what can change the numbers: the jar's contents (src/main, the manifest and lock,
    # bootstrap.sh), how it launches (bin/), and the measurement itself (Regress.java, the pinned
    # reference, the one project it times, this workflow). Tests, examples, docs and the other CI
    # files can't move them. If you add something that goes into the jar or the measured project,
    # add it here, or the check will silently stop covering it. Not applied to ci.yml: its jobs
    # are required checks, and a workflow skipped by path filters leaves a required check pending
    # forever.
    paths:
      - 'src/main/**'
      - 'kwenza.toml'
      - 'kwenza.lock'
      - 'bootstrap.sh'
      - 'bin/**'
      - 'benchmarks/Regress.java'
      - 'benchmarks/REFERENCE'
      - 'benchmarks/commons-lang3/kwenza-deps/**'
      - '.github/workflows/perf.yml'
  # For a run the filter skipped, or to re-run without a new commit. There's no PR to take a base
  # from, so the base is the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Build time vs base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Both jars come from the same bootstrap + self-hosted build path, so the only difference
      # between them is the source.
      - name: Build head
        run: ./bootstrap.sh && bin/kwenza package

      - name: Build base
        run: |
          git worktree add ../base "origin/${{ github.base_ref || github.event.repository.default_branch }}"
          cd ../base
          ./bootstrap.sh
          bin/kwenza package

      # The pinned reference (benchmarks/REFERENCE), so that many small slowdowns, each under the
      # per-PR limit, still add up against a fixed point.
      - name: Build reference
        run: |
          git worktree add ../reference "$(cat benchmarks/REFERENCE)"
          cd ../reference
          ./bootstrap.sh
          bin/kwenza package

      - name: Compare
        working-directory: benchmarks
        run: >
          java Regress.java
          ../../base/target/kwenza-*.jar
          ../target/kwenza-*.jar
          10
          --reference ../../reference/target/kwenza-*.jar
