name: Refresh benchmark figures

# Reruns benchmarks/Bench.java and opens a PR with the regenerated tables and charts for the
# performance page. Runs when a release is published, and on demand. Not on merges: see
# benchmarks/README.adoc, "Keeping the page current".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build kwenza
        run: ./bootstrap.sh && bin/kwenza package

      - name: Run the benchmarks
        working-directory: benchmarks
        run: java Bench.java all both 7 --write-docs

      # A release run measures the tagged commit, but the PR must be cut from the default branch,
      # or it would revert everything merged since. So carry the three generated files across.
      - name: Open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="bench/refresh-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir "$RUNNER_TEMP/figures"
          cp docs/modules/ROOT/partials/benchmark-results.adoc docs/modules/ROOT/images/benchmark-*.svg "$RUNNER_TEMP/figures/"
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout -b "$branch" "origin/${{ github.event.repository.default_branch }}"
          cp "$RUNNER_TEMP/figures/benchmark-results.adoc" docs/modules/ROOT/partials/
          cp "$RUNNER_TEMP/figures"/benchmark-*.svg docs/modules/ROOT/images/
          git add docs/modules/ROOT/partials/benchmark-results.adoc docs/modules/ROOT/images
          git commit -m "docs(benchmarks): refresh figures"
          git push origin "$branch"
          gh pr create --title "docs(benchmarks): refresh figures" \
            --body "Regenerated by the Refresh benchmark figures workflow. Check the prose on the performance page still matches the new figures before merging."
